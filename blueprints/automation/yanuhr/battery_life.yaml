blueprint:
  name: Battery Monitor v5 – Simple iOS Daily
  description: >
    Raz denne skontroluje vybrané batérie a na iPhone pošle jednu súhrnnú
    notifikáciu so zariadeniami na limite alebo pod ním.
    Bez pomocných entít, histórie, JSON a okamžitých upozornení.

  domain: automation

  input:
    battery_sensors:
      name: Senzory batérií
      description: Konkrétne senzory batérie (percentá), ktoré sa majú kontrolovať
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: battery

    threshold:
      name: Limit batérie (%)
      description: Do správy patria batérie s kapacitou nižšou alebo rovnou tejto hodnote
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
          step: 1

    notification_time:
      name: Čas notifikácie
      description: Každý deň v tomto čase sa aktuálne stavy vyhodnotia odznova
      default: "08:00:00"
      selector:
        time: {}

    notification_services:
      name: Notifikačné služby
      description: Služby notify.mobile_app_…, každá na nový riadok
      default: []
      selector:
        text:
          multiple: true

    use_persistent_fallback:
      name: Persistent fallback
      description: Ak nie je nastavená žiadna mobilná služba, vytvorí notifikáciu v Home Assistant
      default: true
      selector:
        boolean: {}

    max_message_length:
      name: Max. dĺžka správy
      description: >
        Pri prekročení sa zobrazí čo najviac celých položiek a na koniec sa doplní +N ďalších.
        Počet v titulku je vždy počet všetkých slabých batérií.
      default: 180
      selector:
        number:
          min: 40
          max: 500
          mode: box
          step: 1

trigger:
  - platform: time
    at: !input notification_time

variables:
  threshold: !input threshold
  sensors: !input battery_sensors
  notify_services: !input notification_services
  use_persistent_fallback: !input use_persistent_fallback
  max_message_length: !input max_message_length

mode: single

action:
  - variables:
      notify_services_filtered: >-
        {%- set services = [notify_services] if (notify_services is string) else (notify_services if (notify_services is iterable) else []) -%}
        {{- services | map('string') | map('trim') | reject('equalto', '') | unique | list -}}

      low_labels: >-
        {%- set sensor_list = [sensors] if (sensors is string) else ((sensors | list) if (sensors is iterable) else []) -%}
        {%- set limit_pct = threshold | float(20) -%}
        {%- set ns = namespace(items=[], seen=[]) -%}
        {%- for eid in sensor_list -%}
          {%- set ent = eid | string | trim -%}
          {%- if ent -%}
            {%- set norm = states(ent) | string | trim | lower | replace(',', '.') | replace('%', '') | replace(' ', '') -%}
            {%- if norm not in ['', 'unknown', 'unavailable', 'none', 'null'] -%}
              {%- set lvl = norm | float(-1) -%}
              {%- if lvl >= 0 and lvl <= 100 and lvl <= limit_pct -%}
                {%- set did = device_id(ent) -%}
                {%- set dev_name = (device_attr(did, 'name_by_user') or device_attr(did, 'name') or '') if did else '' -%}
                {%- set raw_name = (dev_name or state_attr(ent, 'friendly_name') or ent) | string | regex_replace('\\s+', ' ') | trim | replace(';', ',') -%}
                {%- set name_s = raw_name if raw_name else ent -%}
                {%- set ar_raw = area_name(ent) or (area_name(did) if did else none) -%}
                {%- set ar_s = (ar_raw | string | regex_replace('\\s+', ' ') | trim | replace(';', ',')) if ar_raw else '' -%}
                {%- set ar_s = '' if (ar_s | lower) in ['none', 'unknown', 'unavailable'] else ar_s -%}
                {%- set ar_len = ar_s | length -%}
                {%- set name_low = name_s | lower -%}
                {%- set row = namespace(room=false, label=name_s) -%}
                {%- if ar_len > 0 -%}
                  {%- set head = name_low[:ar_len] -%}
                  {%- set nxt = name_low[ar_len:ar_len + 1] -%}
                  {%- if head == (ar_s | lower) and (nxt == '' or nxt in [' ', '-', '–', '—', ':', '/']) -%}
                    {%- set row.room = true -%}
                  {%- endif -%}
                {%- endif -%}
                {%- set row.label = name_s if (row.room or ar_len == 0) else (ar_s ~ ' – ' ~ name_s) -%}
                {%- if row.label in ns.seen -%}
                  {%- set row.label = row.label ~ ' – ' ~ ent -%}
                {%- endif -%}
                {%- set ns.seen = ns.seen + [row.label] -%}
                {%- set pct = (lvl | round(0)) | int(0) -%}
                {%- set ns.items = ns.items + [{'label': row.label, 'pct': pct}] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.items -}}

      notify_title: >-
        {%- set labels = low_labels if (low_labels is iterable and low_labels is not string and low_labels is not mapping) else [] -%}
        {%- set total = labels | length -%}
        {%- if total > 1 -%}
          {{- 'Slabé batérie (' ~ total ~ ')' -}}
        {%- else -%}
          {{- 'Slabá batéria' -}}
        {%- endif -%}

      message_text: >-
        {%- set labels = low_labels if (low_labels is iterable and low_labels is not string and low_labels is not mapping) else [] -%}
        {%- set total = labels | length -%}
        {%- set limit = [max_message_length | int(180), 40] | max -%}
        {%- set fit = namespace(parts=[], stop=false) -%}
        {%- for item in labels -%}
          {%- if not fit.stop -%}
            {%- set pct_txt = '(' ~ item['pct'] ~ '%)' -%}
            {%- set text = item['label'] ~ ' ' ~ pct_txt -%}
            {%- set trial_parts = fit.parts + [text] -%}
            {%- set remaining = total - (trial_parts | length) -%}
            {%- set suffix = (' +' ~ remaining ~ ' ďalších') if remaining > 0 else '' -%}
            {%- set trial = (trial_parts | join('; ')) ~ suffix -%}
            {%- if (trial | length) <= limit -%}
              {%- set fit.parts = trial_parts -%}
            {%- elif (fit.parts | length) == 0 -%}
              {%- set budget = [limit - (suffix | length), 1] | max -%}
              {%- set name_budget = [budget - (pct_txt | length) - 1, 0] | max -%}
              {%- set over = (item['label'] | length) > name_budget or (text | length) > budget -%}
              {%- set name_cut = (name_budget - 1) if (over and name_budget > 1) else name_budget -%}
              {%- set ellipsis = '…' if (over and name_budget > 1) else '' -%}
              {%- set cut_label = ((item['label'][:name_cut] | trim) ~ ellipsis) if over else item['label'] -%}
              {%- set shortened = (cut_label ~ ' ' ~ pct_txt) | trim -%}
              {%- set fit.parts = [shortened] if shortened else [] -%}
              {%- set fit.stop = true -%}
            {%- else -%}
              {%- set fit.stop = true -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set body = fit.parts | join('; ') -%}
        {%- set remaining = total - (fit.parts | length) -%}
        {%- if remaining > 0 and body -%}
          {{- (body ~ ' +' ~ remaining ~ ' ďalších') | replace('\n', '') | replace('\r', '') | trim -}}
        {%- else -%}
          {{- body | replace('\n', '') | replace('\r', '') | trim -}}
        {%- endif -%}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ message_text | length > 0 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_services_filtered | length > 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ notify_services_filtered }}"
                      sequence:
                        - service: "{{ repeat.item }}"
                          data:
                            title: "{{ notify_title }}"
                            message: "{{ message_text }}"
            default:
              - if:
                  - condition: template
                    value_template: "{{ use_persistent_fallback | bool(false) }}"
                then:
                  - service: persistent_notification.create
                    data:
                      notification_id: battery_low
                      title: "{{ notify_title }}"
                      message: "{{ message_text }}"

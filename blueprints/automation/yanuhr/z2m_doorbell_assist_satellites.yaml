# Version: 1.2.0
# Zigbee2MQTT Doorbell to Assist Satellites
#
# Design notes:
# - Button presses are transient Zigbee2MQTT MQTT events, not HA entities.
#   The automation listens to the device state topic and matches action == single.
# - MQTT value_template + payload filtering ignores battery/linkquality/last_seen
#   updates and empty/missing action values (including Z2M action clears).
# - mode: single prevents queued/stale chimes while playback is running.
# - A short internal debounce suppresses duplicate MQTT deliveries of the same
#   press without blocking a legitimate press a few seconds later.
# - Startup protection uses sensor.uptime (Home Assistant instance age), not
#   automation last_triggered. Replayed/retained MQTT state after restart is
#   ignored until the configured grace period has elapsed.
# - Debounce and startup protection are separate concerns; debounce alone does
#   not prevent false rings after an HA restart.
# - Prefer Zigbee2MQTT device-state retain disabled for this button unless you
#   have a specific reason to enable it. Startup protection still applies if
#   retained or republished state arrives during the grace period.
# - Requires the Uptime integration (sensor.uptime). Enable it under
#   Settings → Devices & services if it is not already present.
# - preannounce is forced off so the configured ding-dong plays exactly once.

blueprint:
  name: Zigbee2MQTT Doorbell to Assist Satellites
  author: yanuhr
  description: >
    Turns a Zigbee2MQTT button into a whole-home doorbell.

    Listens directly to the doorbell device MQTT state topic and rings when the
    JSON payload contains `action: single`. A ding-dong is then announced on
    every selected Assist Satellite at once — including Home Assistant Voice
    Preview Edition devices that expose an `assist_satellite` entity.

    After a Home Assistant restart, MQTT may republish or restore a previous
    `action: single` payload. A configurable startup protection period (default
    90 seconds) ignores those messages until Home Assistant has been running
    longer than that period, measured via `sensor.uptime`. Real presses after
    the grace period work immediately. Enable the Uptime integration if needed.

    Zigbee2MQTT device-state retain should normally stay disabled for this
    button. Startup protection still covers retained or reconnect republications.

    No button entity, device trigger, legacy action sensor, or helper is required.
  domain: automation
  homeassistant:
    min_version: "2025.4.0"
  input:
    doorbell_button:
      name: Doorbell Button
      icon: mdi:doorbell
      description: >
        Zigbee2MQTT publishes button presses as JSON on the device state topic.
        Enter that topic below (friendly name may differ per installation).
      input:
        doorbell_mqtt_topic:
          name: Zigbee2MQTT MQTT topic
          description: >
            Device state topic, for example `zigbee2mqtt/doorbell`.
            Only messages whose JSON `action` value is exactly `single` ring the
            chime. Battery, linkquality, last_seen, identify, empty action, and
            other state updates are ignored.
          default: zigbee2mqtt/doorbell
          selector:
            text:

    chime_speakers:
      name: Chime Speakers
      icon: mdi:speaker-multiple
      description: >
        Assist Satellites that should play the doorbell. All selected entities
        are targeted in a single announcement action for near-simultaneous start.
      input:
        assist_satellites:
          name: Assist Satellites
          description: >
            Select one or more `assist_satellite` entities (for example Home
            Assistant Voice Preview Edition devices). Unrelated media players
            are not listed.
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite

    doorbell_sound:
      name: Doorbell Sound
      icon: mdi:music-note
      description: >
        The audio played as the doorbell. The default uses Home Assistant's
        built-in local Assist Satellite chime so the doorbell works offline.

        To use your own ding-dong, place an audio file in the Home Assistant
        media folder (for example `/media/doorbell.mp3`) and select it here, or
        set a media ID such as `media-source://media_source/local/doorbell.mp3`.
      input:
        chime_media:
          name: Doorbell media
          description: >
            Audio file or media ID for the doorbell sound. Home Assistant's
            default announcement pre-chime is disabled so only this sound plays.
          default:
            media_content_id: /api/assist_satellite/static/preannounce.mp3
            media_content_type: music
          selector:
            media:
              accept:
                - audio/*

    advanced:
      name: Advanced
      icon: mdi:cog
      description: >
        Startup protection ignores MQTT `action: single` messages while Home
        Assistant is still within its post-restart grace period. This prevents
        false chimes from retained, restored, or republished Zigbee2MQTT state.
      input:
        startup_protection_seconds:
          name: Startup protection
          description: >
            Seconds after Home Assistant starts during which doorbell MQTT
            messages are ignored (default 90). Based on `sensor.uptime` (Home
            Assistant instance age), not automation reload time. Set to 0 to
            disable. Requires the Uptime integration. Genuine presses during
            this window are also ignored (accepted trade-off).
          default: 90
          selector:
            number:
              min: 0
              max: 300
              step: 1
              unit_of_measurement: seconds
              mode: box

# single: respond immediately, never queue delayed chimes; ignore presses while
# the current announcement is still running. A new press after completion is allowed.
mode: single
max_exceeded: silent

# Internal debounce only (not a user setting): suppress duplicate deliveries of
# the same press. Legitimate presses a few seconds later still ring.
# startup_protection_seconds is Home Assistant uptime grace, not debounce.
variables:
  debounce_seconds: 1
  startup_protection_seconds: !input startup_protection_seconds

triggers:
  # value_template is evaluated per message; compared to payload.
  # Non-JSON payloads and messages without action == single do not fire.
  # Identical consecutive action: single messages still match (no state change
  # required), so two genuine presses both work after the grace period.
  - trigger: mqtt
    topic: !input doorbell_mqtt_topic
    value_template: "{{ value_json.action | default('', true) }}"
    payload: "single"

conditions:
  # 1) Startup protection: HA instance age via sensor.uptime (not last_triggered).
  #    When seconds is 0, protection is disabled. If Uptime is missing/unavailable
  #    and protection is enabled, fail closed (do not chime).
  - condition: template
    value_template: >
      {{ startup_protection_seconds | int == 0
         or (
              states('sensor.uptime') not in ['unknown', 'unavailable', '']
              and now() - as_datetime(states('sensor.uptime'))
                 > timedelta(seconds=startup_protection_seconds | int)
            ) }}
  # 2) Short duplicate-delivery debounce (separate from startup protection).
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds()
            >= debounce_seconds }}

actions:
  # One multi-target announce — do not loop satellites or insert delays.
  # continue_on_error keeps other satellites ringing if one target is unavailable.
  - action: assist_satellite.announce
    continue_on_error: true
    target:
      entity_id: !input assist_satellites
    data:
      media_id: !input chime_media
      preannounce: false

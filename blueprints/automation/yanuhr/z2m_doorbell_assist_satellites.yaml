# Version: 1.3.0
# Zigbee2MQTT Doorbell to Assist Satellites
#
# Design notes:
# - Physical presses are Zigbee2MQTT MQTT device action triggers, not inferred
#   from the general device state topic JSON.
# - The general state topic (zigbee2mqtt/<device>) can republish a historical
#   action: single on reconnect, rejoin, Z2M restart, or MQTT resubscribe.
#   That path is intentionally not used.
# - Zigbee2MQTT discovers MQTT device triggers after each physical action has
#   been generated at least once. Press the doorbell once before configuring
#   so the `single` action appears for the device.
# - mode: single prevents queued/stale chimes while playback is running.
# - No startup grace period, helpers, legacy action sensors, or state-payload
#   JSON matching are required when using a true MQTT device action trigger.
# - preannounce is forced off so the configured ding-dong plays exactly once.

blueprint:
  name: Zigbee2MQTT Doorbell to Assist Satellites
  author: yanuhr
  description: >
    Turns a Zigbee2MQTT button into a whole-home doorbell.

    Uses the Zigbee2MQTT MQTT device trigger for the physical button action
    (recommended by Zigbee2MQTT). When the discovered `single` action fires,
    a ding-dong is announced on every selected Assist Satellite at once —
    including Home Assistant Voice Preview Edition devices that expose an
    `assist_satellite` entity.

    First-time setup: press the physical doorbell once so Zigbee2MQTT can
    discover the action trigger in Home Assistant, then select that MQTT
    device here. The action subtype defaults to `single`.

    This blueprint does not listen to the general device state topic. State
    republish on Zigbee reconnect, Zigbee2MQTT restart, device rejoin, or MQTT
    recovery must not ring the doorbell.

    No button entity, legacy action sensor, helper, or startup grace period
    is required.
  domain: automation
  homeassistant:
    min_version: "2025.4.0"
  input:
    doorbell_button:
      name: Doorbell Button
      icon: mdi:doorbell
      description: >
        Select the Zigbee2MQTT doorbell as an MQTT device and the action
        subtype for a single press. Press the physical button once first so
        Home Assistant discovers the action trigger.
      input:
        doorbell_device:
          name: Zigbee2MQTT doorbell device
          description: >
            MQTT device for the Zigbee2MQTT doorbell button. Use the device
            selector (MQTT integration). After selecting the device, ensure
            the `single` action has been discovered by pressing the button
            once if it is not listed yet in Developer tools / device triggers.
          selector:
            device:
              filter:
                - integration: mqtt
              multiple: false
        doorbell_action:
          name: Button action subtype
          description: >
            Zigbee2MQTT MQTT device trigger subtype for a single press.
            Usually `single`. Must match the discovered action for this device.
          default: single
          selector:
            text:

    chime_speakers:
      name: Chime Speakers
      icon: mdi:speaker-multiple
      description: >
        Assist Satellites that should play the doorbell. All selected entities
        are targeted in a single announcement action for near-simultaneous start.
      input:
        assist_satellites:
          name: Assist Satellites
          description: >
            Select one or more `assist_satellite` entities (for example Home
            Assistant Voice Preview Edition devices). Unrelated media players
            are not listed.
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite

    doorbell_sound:
      name: Doorbell Sound
      icon: mdi:music-note
      description: >
        The audio played as the doorbell. The default uses Home Assistant's
        built-in local Assist Satellite chime so the doorbell works offline.

        To use your own ding-dong, place an audio file in the Home Assistant
        media folder (for example `/media/doorbell.mp3`) and select it here, or
        set a media ID such as `media-source://media_source/local/doorbell.mp3`.
      input:
        chime_media:
          name: Doorbell media
          description: >
            Audio file or media ID for the doorbell sound. Home Assistant's
            default announcement pre-chime is disabled so only this sound plays.
          default:
            media_content_id: /api/assist_satellite/static/preannounce.mp3
            media_content_type: music
          selector:
            media:
              accept:
                - audio/*

# single: respond immediately, never queue delayed chimes; ignore presses while
# the current announcement is still running. A new press after completion is allowed.
mode: single
max_exceeded: silent

triggers:
  # Zigbee2MQTT MQTT device trigger (recommended). Fires only on a discovered
  # action event — not on general state-topic republish.
  # Consecutive identical presses (subtype: single) each fire a new trigger.
  - trigger: device
    domain: mqtt
    device_id: !input doorbell_device
    type: action
    subtype: !input doorbell_action

actions:
  # One multi-target announce — do not loop satellites or insert delays.
  # continue_on_error keeps other satellites ringing if one target is unavailable.
  - action: assist_satellite.announce
    continue_on_error: true
    target:
      entity_id: !input assist_satellites
    data:
      media_id: !input chime_media
      preannounce: false

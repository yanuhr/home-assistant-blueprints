# Version: 1.4.1
# Zigbee2MQTT Doorbell to Assist Satellites
#
# Design notes:
# - Physical presses are Home Assistant MQTT event entities exposed by
#   Zigbee2MQTT (experimental event entities), not MQTT device triggers and
#   not the general device state topic.
# - MQTT device triggers for this button can still fire on reconnect / wakeup
#   / ping / rejoin without a physical press, so they are not used.
# - The general state topic (zigbee2mqtt/<device>) can republish a historical
#   action: single on reconnect. That path is intentionally not used and must
#   not be reintroduced as a fallback.
# - Enable Zigbee2MQTT Home Assistant experimental event entities, restart Z2M
#   if required, press the doorbell once, then select the discovered event.*
#   entity below.
# - Trigger uses to: null (any new main state, ignoring attribute-only changes).
#   The event entity main state is the timestamp of the latest event, so every
#   genuine press produces a new timestamp even when event_type stays `single`.
#   Do not trigger on event_type attribute changes.
# - Conditions then require a valid from/to state, reject unavailable/unknown
#   previous states, and require event_type == configured value (default single).
# - mode: single prevents queued/stale chimes while playback is running.
# - preannounce is forced off so the configured ding-dong plays exactly once.

blueprint:
  name: Zigbee2MQTT Doorbell to Assist Satellites
  author: yanuhr
  description: >
    Turns a Zigbee2MQTT button into a whole-home doorbell.

    Uses the Zigbee2MQTT Home Assistant MQTT event entity for the physical
    button action. When that event entity reports `event_type: single`, a
    ding-dong is announced on every selected Assist Satellite at once —
    including Home Assistant Voice Preview Edition devices that expose an
    `assist_satellite` entity.

    Setup:
    1. In Zigbee2MQTT, enable Home Assistant experimental event entities
       (`homeassistant.experimental_event_entities: true`).
    2. Restart Zigbee2MQTT if required.
    3. Press the physical doorbell once so the `event.*` entity appears and
       updates.
    4. Select that event entity below.

    This blueprint does not use MQTT device triggers or the general device
    state topic. It reacts only when the event entity's main state timestamp
    changes (`to: null`, ignoring attribute-only updates), then checks that
    the previous state was not unavailable/unknown and that event_type is
    `single`. Reconnect and availability recovery must not ring the doorbell.

    No helpers, legacy action sensors, startup grace period, or debounce
    windows are used.
  domain: automation
  homeassistant:
    min_version: "2025.4.0"
  input:
    doorbell_button:
      name: Doorbell Button
      icon: mdi:doorbell
      description: >
        Select the Zigbee2MQTT doorbell MQTT event entity. Enable Z2M
        experimental event entities first, then press the button once so the
        event entity is discovered.
      input:
        doorbell_event_entity:
          name: Doorbell event entity
          description: >
            Home Assistant `event` entity for the Zigbee2MQTT doorbell
            (for example `event.doorbell_action` or `event.doorbell_click`).
            Domain is restricted to `event`. Do not select a sensor, binary
            sensor, or MQTT device trigger.
          selector:
            entity:
              filter:
                - domain: event
              multiple: false
        doorbell_event_type:
          name: Event type
          description: >
            Value of the event entity `event_type` attribute for a normal
            single press. Usually `single`.
          default: single
          selector:
            text:

    chime_speakers:
      name: Chime Speakers
      icon: mdi:speaker-multiple
      description: >
        Assist Satellites that should play the doorbell. All selected entities
        are targeted in a single announcement action for near-simultaneous start.
      input:
        assist_satellites:
          name: Assist Satellites
          description: >
            Select one or more `assist_satellite` entities (for example Home
            Assistant Voice Preview Edition devices). Unrelated media players
            are not listed.
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite

    doorbell_sound:
      name: Doorbell Sound
      icon: mdi:music-note
      description: >
        The audio played as the doorbell. The default uses Home Assistant's
        built-in local Assist Satellite chime so the doorbell works offline.

        To use your own ding-dong, place an audio file in the Home Assistant
        media folder (for example `/media/doorbell.mp3`) and select it here, or
        set a media ID such as `media-source://media_source/local/doorbell.mp3`.
      input:
        chime_media:
          name: Doorbell media
          description: >
            Audio file or media ID for the doorbell sound. Home Assistant's
            default announcement pre-chime is disabled so only this sound plays.
          default:
            media_content_id: /api/assist_satellite/static/preannounce.mp3
            media_content_type: music
          selector:
            media:
              accept:
                - audio/*

# single: respond immediately, never queue delayed chimes; ignore presses while
# the current announcement is still running. A new press after completion is allowed.
mode: single
max_exceeded: silent

variables:
  doorbell_event_type: !input doorbell_event_type

triggers:
  # Any new main state (event timestamp), ignoring attribute-only updates.
  # to: null = "Any state (ignoring attribute changes)" in the HA UI.
  # Do not trigger on event_type attribute changes — consecutive genuine
  # presses keep event_type `single`; the timestamp state distinguishes them.
  - trigger: state
    entity_id: !input doorbell_event_entity
    to: null

conditions:
  # Reject missing from_state and reconnect / availability recovery.
  - condition: template
    value_template: >
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unavailable', 'unknown'] }}
  # Require a valid to_state with the configured press event type.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none
         and trigger.to_state.attributes.get('event_type') == doorbell_event_type }}

actions:
  # One multi-target announce — do not loop satellites or insert delays.
  # continue_on_error keeps other satellites ringing if one target is unavailable.
  - action: assist_satellite.announce
    continue_on_error: true
    target:
      entity_id: !input assist_satellites
    data:
      media_id: !input chime_media
      preannounce: false
